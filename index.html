<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阻止搗蛋大目仔！</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: linear-gradient(160deg, #7ec850 0%, #4e9a2f 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #2b3a17;
  }
  .game {
    background: #fdf6e3;
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    padding: 28px 28px 34px;
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  h1 { font-size: 26px; margin-bottom: 4px; color: #3d6b1f; }
  .subtitle { font-size: 13px; color: #7a8a5f; margin-bottom: 18px; }
  .stats {
    display: flex;
    justify-content: space-around;
    margin-bottom: 18px;
  }
  .stat {
    background: #eef3d8;
    border-radius: 14px;
    padding: 10px 16px;
    min-width: 110px;
  }
  .stat .label { font-size: 12px; color: #7a8a5f; }
  .stat .value { font-size: 26px; font-weight: 700; color: #3d6b1f; }
  .timer-danger .value { color: #d94f2b; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .hole {
    position: relative;
    aspect-ratio: 1 / 1;
    background: radial-gradient(ellipse at center bottom, #6b4423 0%, #4a2f18 70%);
    border-radius: 50% 50% 45% 45%;
    overflow: hidden;
    cursor: pointer;
    box-shadow: inset 0 -6px 12px rgba(0,0,0,0.4);
  }
  .hole::after {
    content: "";
    position: absolute;
    bottom: 0; left: 8%;
    width: 84%; height: 22%;
    background: rgba(0,0,0,0.35);
    border-radius: 50%;
    z-index: 3;
  }
  .mole {
    position: absolute;
    bottom: -100%;
    left: 50%;
    transform: translateX(-50%);
    width: 62%;
    transition: bottom 0.12s ease-out;
    z-index: 2;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
  }
  .hole.up .mole { bottom: 8%; }
  .btn {
    background: #e8622c;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 40px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 0 #b8481c;
    transition: transform 0.05s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8481c; }
  .btn:disabled { background: #b7b7b7; box-shadow: 0 4px 0 #8f8f8f; cursor: not-allowed; }
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .result {
    background: #fdf6e3;
    border-radius: 20px;
    padding: 30px 26px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .result h2 { font-size: 24px; color: #3d6b1f; margin-bottom: 14px; }
  .result .big { font-size: 48px; font-weight: 800; color: #e8622c; line-height: 1.1; }
  .result .rank {
    font-size: 18px;
    margin: 16px 0 6px;
    color: #2b3a17;
  }
  .result .rank b { color: #d94f2b; font-size: 24px; }
  .board {
    text-align: left;
    margin: 18px 0;
    background: #eef3d8;
    border-radius: 12px;
    padding: 12px 14px;
    max-height: 200px;
    overflow-y: auto;
  }
  .board .row {
    display: flex;
    justify-content: space-between;
    padding: 5px 4px;
    font-size: 14px;
    border-bottom: 1px dashed #c8d4a0;
  }
  .board .row:last-child { border-bottom: none; }
  .board .row.me { background: #ffe6b3; border-radius: 8px; font-weight: 700; }
  .name-box { margin-bottom: 16px; }
  .name-box label { display: block; font-size: 13px; color: #7a8a5f; margin-bottom: 6px; }
  .name-box input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 2px solid #c8d4a0;
    border-radius: 12px;
    background: #fff;
    color: #2b3a17;
    text-align: center;
    outline: none;
  }
  .name-box input:focus { border-color: #7ec850; }
  .board .rk { color: #7a8a5f; width: 30px; }
  .board .sc { color: #3d6b1f; font-weight: 700; }
</style>
</head>
<body>
  <div class="game">
    <h1>🔨 阻止搗蛋大目仔！</h1>
    <p class="subtitle">在15秒內盡量把搗蛋大目仔打退！</p>
    <div class="stats">
      <div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div>

    <div class="grid" id="grid"></div>
    <div class="name-box">
      <label for="nickname">輸入你的昵稱後開始遊戲</label>
      <input type="text" id="nickname" maxlength="12" placeholder="例：小明">
    </div>
    <button class="btn" id="startBtn">開始遊戲</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="result">
      <h2>遊戲結束！</h2>
      <div class="big"><span id="finalScore">0</span> 隻</div>
      <div class="rank">你這一局排名：第 <b id="rankNum">-</b> 名 / 共 <span id="rankTotal">-</span> 人</div>
      <div class="board" id="board"></div>
      <button class="btn" id="againBtn">再玩一次</button>
    </div>
  </div>

const startBtn = document.getElementById("startBtn");
const againBtn = document.getElementById("againBtn");
const overlay = document.getElementById("overlay");
const finalScoreEl = document.getElementById("finalScore");
const rankNumEl = document.getElementById("rankNum");
const rankTotalEl = document.getElementById("rankTotal");
const boardEl = document.getElementById("board");
const nicknameEl = document.getElementById("nickname");
let playerName = "玩家";

let holes = [];
let score = 0;
let timeLeft = GAME_TIME;
let running = false;
let popTimer = null;
let countdown = null;

// build holes
for (let i = 0; i < HOLES; i++) {
  const hole = document.createElement("div");
  hole.className = "hole";
  const mole = document.createElement("img");
  mole.className = "mole";
  mole.src = MOLE_IMG;
  mole.alt = "mole";
  hole.appendChild(mole);
  hole.addEventListener("click", () => whack(hole, mole));
  grid.appendChild(hole);
  holes.push({ hole, mole, up: false, hittable: false });
}

function whack(hole, mole) {
  if (!running) return;
  const h = holes.find(x => x.hole === hole);
  if (!h.up || !h.hittable) return;
  h.hittable = false;
  score++;
  scoreEl.textContent = score;
  mole.src = HIT_IMG;
  setTimeout(() => {
    hole.classList.remove("up");
    h.up = false;
    setTimeout(() => { mole.src = MOLE_IMG; }, 150);
  }, 220);
}

function popRandom() {
  const down = holes.filter(h => !h.up);
  if (down.length === 0) return;
  const h = down[Math.floor(Math.random() * down.length)];
  h.up = true;
  h.hittable = true;
  h.mole.src = MOLE_IMG;
  h.hole.classList.add("up");
  const stay = 700 + Math.random() * 600;
  setTimeout(() => {
    if (h.up) {
      h.hole.classList.remove("up");
      h.up = false;
      h.hittable = false;
    }
  }, stay);
}

function scheduleNext() {
  if (!running) return;
  popRandom();
  const delay = 500 + Math.random() * 450;
  popTimer = setTimeout(scheduleNext, delay);
}

function startGame() {
  const nm = (nicknameEl.value || "").trim();
  if (!nm) {
    nicknameEl.focus();
    nicknameEl.style.borderColor = "#d94f2b";
    nicknameEl.placeholder = "請先輸入昵稱！";
    return;
  }
  nicknameEl.style.borderColor = "";
  playerName = nm;
  score = 0;
  timeLeft = GAME_TIME;
  running = true;
  scoreEl.textContent = "0";
  timerEl.textContent = GAME_TIME;
  timerBox.classList.remove("timer-danger");
  startBtn.disabled = true;
  overlay.classList.remove("show");
  holes.forEach(h => { h.up = false; h.hittable = false; h.hole.classList.remove("up"); h.mole.src = MOLE_IMG; });

  scheduleNext();
  countdown = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 5) timerBox.classList.add("timer-danger");
    if (timeLeft <= 0) endGame();
  }, 1000);
}

async function endGame() {
  running = false;
  clearInterval(countdown);
  clearTimeout(popTimer);
  holes.forEach(h => { h.hole.classList.remove("up"); h.up = false; h.hittable = false; });
  startBtn.disabled = false;

  finalScoreEl.textContent = score;
  overlay.classList.add("show");

  if (API_URL) {
    rankNumEl.textContent = "…";
    rankTotalEl.textContent = "…";
    boardEl.innerHTML = '<div style="text-align:center;padding:14px;color:#7a8a5f;">排行榜載入中…</div>';
    try {
      const board = await submitScoreRemote(playerName, score);
      showResult(board);
    } catch (err) {
      const board = submitScoreLocal(playerName, score);
      showResult(board);
      const tip = document.createElement("div");
      tip.style.cssText = "text-align:center;padding:6px;color:#d94f2b;font-size:12px;";
      tip.textContent = "❗ 雲端排行榜連線失敗，目前顯示的是本機紀錄";
      boardEl.prepend(tip);
    }
  } else {
    const board = submitScoreLocal(playerName, score);
    showResult(board);
  }
}

function showResult(board) {
  board = board.slice().sort((a, b) => b.score - a.score || a.time - b.time);
  const total = board.length;
  const myIndex = board.findIndex(e => (e.name || "") === playerName);
  const myScore = myIndex >= 0 ? board[myIndex].score : score;
  const rank = 1 + board.filter(e => e.score > myScore).length;
  rankNumEl.textContent = rank;
  rankTotalEl.textContent = total;
  renderBoard(board.slice(0, 10), myIndex);
}

async function submitScoreRemote(name, sc) {
  // 使用 text/plain 避免 Apps Script 的 CORS preflight 問題
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ name: name, score: sc })
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "server error");
  return data.board || [];
}

function submitScoreLocal(name, sc) {
  let board = loadBoard();
  const prev = board.find(e => (e.name || "") === name);
  let entry;
  if (prev && prev.score >= sc) {
    entry = prev;
  } else {
    entry = { name: name, score: sc, time: Date.now() };
  }
  board = board.filter(e => (e.name || "") !== name);
  board.push(entry);
  board.sort((a, b) => b.score - a.score || a.time - b.time);
  localStorage.setItem(LB_KEY, JSON.stringify(board.slice(0, 50)));
  return board;
}

function loadBoard() {
  try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; }
  catch (e) { return []; }
}

function renderBoard(list, myIndex) {
  boardEl.innerHTML = "";
  let ranks = [];
  for (let i = 0; i < list.length; i++) {
    if (i > 0 && list[i].score === list[i - 1].score) ranks.push(ranks[i - 1]);
    else ranks.push(i + 1);
  }
  list.forEach((e, i) => {
    const rk = ranks[i];
    const row = document.createElement("div");
    row.className = "row" + (i === myIndex ? " me" : "");
    const medal = rk === 1 ? "🥇" : rk === 2 ? "🥈" : rk === 3 ? "🥉" : rk;
    row.innerHTML = '<span class="rk">' + medal + '</span>' +
                    '<span>' + escapeHtml(e.name || "玩家") + (i === myIndex ? " (本局)" : "") + '</span>' +
                    '<span class="sc">' + e.score + ' 隻</span>';
    boardEl.appendChild(row);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

startBtn.addEventListener("click", startGame);
againBtn.addEventListener("click", startGame);
nicknameEl.addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });
</script>
</body>
</html>
